<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Weather</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300;12..96,500;12..96,800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body data-theme="sun">
<main class="wrap">

  <div class="bar">
    <form class="search" id="searchForm" role="search">
      <input id="q" type="search" placeholder="Search a city" aria-label="Search a city" autocomplete="off">
      <button class="btn" type="submit">Search</button>
    </form>
    <button class="btn ghost" id="locate" type="button">Use my location</button>
    <div class="units" role="group" aria-label="Temperature unit">
      <button type="button" data-unit="c" aria-pressed="true">°C</button>
      <button type="button" data-unit="f" aria-pressed="false">°F</button>
    </div>
  </div>
  <div class="recent" id="recent" aria-label="Recent searches"></div>

  <div class="msg" id="msg" hidden role="alert"></div>

  <div id="app" hidden>
    <section class="hero">
      <div>
        <div class="place"><strong id="city"></strong><span id="localtime"></span></div>
        <div class="temp" id="temp"></div>
        <div class="cond"><img id="icon" alt=""><span id="condText"></span><small id="feels"></small></div>
      </div>
      <div class="sun">
        <div>Sunrise<b id="sunrise"></b></div>
        <div>Sunset<b id="sunset"></b></div>
      </div>
    </section>

    <h2>Next 24 hours</h2>
    <div class="panel hours" id="hours"></div>

    <h2>5-day forecast</h2>
    <ul class="panel days" id="days"></ul>

    <h2>Right now</h2>
    <div class="stats" id="stats"></div>
  </div>

  <footer>Weather data from <a href="https://www.weatherapi.com/" target="_blank" rel="noopener">WeatherAPI.com</a></footer>
</main>

<script src="script.js"></script>
</body>
</html>
